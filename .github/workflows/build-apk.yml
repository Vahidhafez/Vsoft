name: Build Vsoft APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare debug keystore
        run: |
          mkdir -p ~/.config/.android
          if [ ! -f ~/.config/.android/debug.keystore ]; then
            keytool -genkeypair -v               -keystore ~/.config/.android/debug.keystore               -storepass android               -alias AndroidDebugKey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Show signing fingerprints
        run: gradle signingReport --no-daemon

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vsoft-APK
          path: app/build/outputs/apk/debug/app-debug.apk
