name: Build Vsoft APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vsoft-debug-keystore-v1

      - name: Prepare stable signing (if configured)
        env:
          VSOFT_KEYSTORE_BASE64: ${{ secrets.VSOFT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$VSOFT_KEYSTORE_BASE64" ]; then
            mkdir -p app/signing
            echo "$VSOFT_KEYSTORE_BASE64" | base64 --decode > app/signing/vsoft-release.jks
            echo "VSOFT_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "VSOFT_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            echo "Stable signing is not configured; using the standard debug signing key."
          fi

      - name: Build APK
        env:
          KSTOREPWD: ${{ secrets.VSOFT_KEYSTORE_PASSWORD }}
          KEYALIAS: ${{ secrets.VSOFT_KEY_ALIAS }}
          KEYPWD: ${{ secrets.VSOFT_KEY_PASSWORD }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace -PVSOFT_VERSION_CODE=${{ github.run_number }} -PVSOFT_VERSION_NAME=1.0.${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vsoft-APK
          path: app/build/outputs/apk/debug/app-debug.apk
