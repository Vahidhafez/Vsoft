name: Build and Release Vsoft APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare release keystore
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p app/signing
          echo "$KEYSTORE_BASE64" | base64 --decode > app/signing/vsoft-release.jks
          test -s app/signing/vsoft-release.jks

      - name: Build signed release APK
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle assembleRelease --no-daemon --stacktrace \
            -PVSOFT_VERSION_CODE=${{ github.run_number }} \
            -PVSOFT_VERSION_NAME=1.0.${{ github.run_number }}

      - name: Build debug APK for non-main CI
        if: github.ref != 'refs/heads/main'
        run: |
          set -euo pipefail
          gradle assembleDebug --no-daemon --stacktrace \
            -PVSOFT_VERSION_CODE=${{ github.run_number }} \
            -PVSOFT_VERSION_NAME=1.0.${{ github.run_number }}

      - name: Verify release APK signature
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload main release artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Vsoft-APK-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload CI debug artifact
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Vsoft-CI-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.${{ github.run_number }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" app/build/outputs/apk/release/app-release.apk \
            --title "Vsoft $RELEASE_TAG" \
            --generate-notes
