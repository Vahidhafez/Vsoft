name: Build Vsoft APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare stable release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          mkdir -p app/signing
          echo "$KEYSTORE_BASE64" | base64 --decode > app/signing/vsoft-release.jks
          test -s app/signing/vsoft-release.jks

      - name: Build signed Release APK
        env:
          VSOFT_SIGNING_ENABLED: "true"
          KSTOREPWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          gradle assembleRelease --no-daemon --stacktrace             -PVSOFT_VERSION_CODE=${{ github.run_number }}             -PVSOFT_VERSION_NAME=1.0.${{ github.run_number }}

      - name: Verify Release APK
        run: |
          set -e
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Vsoft-APK-Release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
